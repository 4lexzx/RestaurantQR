<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuGo | Pedido para llevar</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/theme.css?v=20260928a">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="../js/theme-init.js"></script>
  </head>

<body class="client-flow-page client-flow-takeaway min-h-screen">

    <main class="client-intake-stage" data-anim="fade-up">
      <section class="client-intake-shell">
        <aside class="client-intake-brand">
          <img src="../img/Log.png" alt="Logo MenuGo" class="client-intake-logo" data-logo />
          <div>
            <p class="client-flow-kicker"><i class="bi bi-bag-heart-fill"></i> Recojo en tienda</p>
            <h1>Haz tu pedido.<br>Nosotros te avisamos.</h1>
            <p>Completa tus datos y pasa directo a elegir tus platos. Sin filas y sin esperas.</p>
          </div>
          <div class="client-intake-benefits"><span><i class="bi bi-lightning-charge"></i> Rápido</span><span><i class="bi bi-shield-check"></i> Seguro</span></div>
        </aside>

        <section class="client-takeaway-form">
          <div class="client-intake-heading">
            <span><i class="bi bi-person"></i></span>
            <p>Paso 1 de 2</p>
            <h2>¿A nombre de quién?</h2>
            <small>Usaremos estos datos únicamente para identificar tu pedido.</small>
          </div>

          <form id="formParaLlevar" class="space-y-5">

            <label class="tenant-field"><span>Nombre</span><div class="tenant-input-wrap"><i class="bi bi-person"></i><input type="text" id="nombre" placeholder="Ejemplo: Liam" required></div></label>

            <label class="tenant-field"><span>Apellidos</span><div class="tenant-input-wrap"><i class="bi bi-person-vcard"></i><input type="text" id="apellidos" placeholder="Ejemplo: Pérez González" required></div></label>

            <button type="submit" class="tenant-login-submit">
                <span>Continuar al menú</span><i class="bi bi-arrow-right"></i>
            </button>

            <a href="index.html" class="block text-center text-sm text-gray-500 hover:text-orange-500 transition">
                Volver al inicio
            </a>

          </form>
        </section>
      </section>
    </main>

    <script>
        const form = document.getElementById("formParaLlevar");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const apellidos = document.getElementById("apellidos").value.trim();

            if (nombre === "" || apellidos === "") {
                alert("Debes ingresar nombre y apellidos.");
                return;
            }

            localStorage.setItem("tipoConsumo", "llevar");
            localStorage.setItem("nombreCliente", nombre);
            localStorage.setItem("apellidosCliente", apellidos);
            localStorage.removeItem("mesa");

            window.location.href = "MenuParaLlevar.html";
        });
    </script>

    <script src="../js/config.js"></script>
  <script src="../js/splash.js"></script>
  <script src="../js/animaciones.js" defer></script>
</body>

</html>
