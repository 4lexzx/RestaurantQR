<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MenuGo | Pedido para llevar</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/theme.css?v=20260901d">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="../js/theme-init.js"></script>
  </head>

<body class="client-flow-page client-flow-takeaway min-h-screen flex items-center justify-center px-4">

    <main class="client-takeaway-form w-full max-w-md bg-white rounded-3xl p-8" data-anim="fade-up">

        <!-- Logo -->
        <div class="text-center mb-6">
            <img src="../img/Log.png" alt="Logo MenuGo" class="w-36 mx-auto mb-4" data-logo />
            <p class="client-flow-kicker justify-center"><i class="bi bi-bag-heart-fill"></i> Recojo en tienda</p>
            <h1 class="mt-2 text-3xl font-black text-gray-800">¿A nombre de quién?</h1>
            <p class="text-gray-500 mt-2">
                Ingresa tus datos para poder llamarte cuando tu pedido esté listo.
            </p>
        </div>

        <!-- Formulario -->
        <form id="formParaLlevar" class="space-y-5">

            <div>
                <label for="nombre" class="block text-sm font-semibold text-gray-700 mb-1">
                    Nombre
                </label>
                <input type="text" id="nombre"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400"
                    placeholder="Ejemplo: Liam" required>
            </div>

            <div>
                <label for="apellidos" class="block text-sm font-semibold text-gray-700 mb-1">
                    Apellidos
                </label>
                <input type="text" id="apellidos"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-orange-400"
                    placeholder="Ejemplo: Pérez González" required>
            </div>

            <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl shadow-md transition">
                Continuar al menú
            </button>

            <a href="index.html" class="block text-center text-sm text-gray-500 hover:text-orange-500 transition">
                Volver al inicio
            </a>

        </form>
    </main>

    <script>
        const form = document.getElementById("formParaLlevar");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const nombre = document.getElementById("nombre").value.trim();
            const apellidos = document.getElementById("apellidos").value.trim();

            if (nombre === "" || apellidos === "") {
                alert("Debes ingresar nombre y apellidos.");
                return;
            }

            localStorage.setItem("tipoConsumo", "llevar");
            localStorage.setItem("nombreCliente", nombre);
            localStorage.setItem("apellidosCliente", apellidos);
            localStorage.removeItem("mesa");

            window.location.href = "MenuParaLlevar.html";
        });
    </script>

    <script src="../js/config.js"></script>
  <script src="../js/splash.js"></script>
  <script src="../js/animaciones.js" defer></script>
</body>

</html>
