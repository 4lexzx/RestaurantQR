<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MenuGo | Seguimiento para llevar</title>
  <script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../css/theme.css?v=20260928a">
  <link rel="stylesheet" href="../css/theme-integrity.css?v=20260928c">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <script src="../js/theme-init.js"></script>
  </head>

<body class="client-flow-page client-flow-takeaway min-h-screen text-slate-900">
  <main class="client-flow-shell mx-auto w-full max-w-5xl px-4 py-6">
    <header class="client-flow-hero mb-6 p-6" data-anim="fade-up">
      <div class="flex flex-col items-center gap-4 text-center md:flex-row md:text-left">
        <img src="../img/Log.png" alt="Logo MenuGo" class="h-20 w-20 rounded-full bg-white object-contain p-2" data-logo />
        <div>
          <p class="client-flow-kicker"><i class="bi bi-clock-history"></i> Pedido para recoger</p>
          <h1 class="mt-1 text-3xl font-black text-white md:text-4xl">Seguimiento del pedido</h1>
          <p class="mt-2 text-white/90">Consulta si tu pedido sigue en cocina o si ya está listo para recoger.</p>
        </div>
      </div>
    </header>

    <section class="client-flow-card rounded-3xl bg-white p-5" data-anim="fade-up">
      <div class="grid grid-cols-1 gap-3 md:grid-cols-[minmax(0,1fr)_auto] md:items-end">
        <label class="block">
          <span class="mb-1 block text-xs font-black uppercase tracking-wide text-slate-500">Código de seguimiento</span>
          <input id="codigo-seguimiento" type="text" placeholder="LLEV-001"
            class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-lg font-black uppercase outline-none focus:ring-2 focus:ring-orange-400">
        </label>
        <button type="button" onclick="consultarSeguimientoManual()"
          class="rounded-2xl bg-orange-500 px-6 py-3 font-black text-white hover:bg-orange-600">
          Consultar
        </button>
      </div>
      <p class="mt-3 text-sm font-semibold text-slate-500"><i class="bi bi-lightning-charge-fill"></i> El estado se actualiza en tiempo real cuando cocina registra un cambio.</p>
    </section>

    <section id="seguimiento-contenido" class="client-flow-card mt-5 rounded-3xl bg-white p-8 text-center" data-anim="fade-up">
      <h2 class="text-2xl font-black text-slate-800">Ingresa tu código para ver el seguimiento</h2>
      <p class="mt-2 text-slate-500">Ejemplo: LLEV-001</p>
    </section>
  </main>

  <script src="../js/config.js"></script>
  <script src="../js/splash.js"></script>
  <script src="../js/animaciones.js" defer></script>
  <script src="../js/tiempo-real.js"></script>
  <script src="../js/seguimiento-llevar.js"></script>
</body>

</html>
